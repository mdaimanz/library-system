spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/library_system}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        formal_sql: true
    open-in-view: false
  sql:
    init:
      mode: always

server:
  port: ${SERVER_PORT:8080}